name: Build and publish Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Checkout station source
        uses: actions/checkout@v4
        with:
          repository: irail/stations
          path: .cache/irail-stations
      - name: Install station dependencies
        working-directory: .cache/irail-stations
        run: npm ci
      - name: Generate station source data
        working-directory: .cache/irail-stations
        run: node ./bin/build.js > stations.jsonld
      - name: Build station data and pages
        run: npm run build:stations -- --source .cache/irail-stations
      - name: Run unit tests
        run: npm test
      - name: Build website
        run: npm run build
      - name: Install browser for checks
        run: npx playwright install --with-deps chromium
      - name: Check beta in browser
        run: npm run test:beta
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
